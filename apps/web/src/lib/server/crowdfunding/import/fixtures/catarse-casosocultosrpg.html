<script>self.__next_f.push([1,"1:{\"projectWithSocial\":{\"id\":\"3fa4faf7-b8b3-4a68-a787-8c01e36a0327\",\"slug\":\"casosocultosrpg\",\"title\":\"Casos Ocultos RPG\",\"summary\":\"Desvende mistérios ocultos neste RPG de Horror Investigativo ambientado nos anos 20\",\"status\":\"Launch\",\"fundingType\":\"All or Nothing\",\"startDate\":\"2026-10-09T00:56:43.215Z\",\"endDate\":\"2026-11-10T02:59:00.000Z\",\"thumbnail\":\"https://catarse-backend-prod.nyc3.digitaloceanspaces.com/catarse-backend-prod/project_photo/ef4767a7e5b418105a807.png\",\"user\":{\"publicName\":\"Coisinha Games\"},\"story\":\"$2\"},\"rewards\":[{\"name\":\"Livro Físico e PDF\",\"description\":\"Você receberá:\\n* Livro físico Casos Ocultos RPG: O Chamado dos Antigos\\n* Livro digital Casos Ocultos RPG: O Chamado dos Antigos\\n* Arquivos digitais para fabricação dos Props (cartas, jornais, passaportes, etc)\",\"items\":[{\"name\":\"Livro físico Casos Ocultos RPG: O Chamado dos Antigos\",\"description\":\"\"},{\"name\":\"Livro digital (PDF) Casos Ocultos RPG: O Chamado dos Antigos\",\"description\":\"\"}]}]}\n2:T5cd,Casos Ocultos RPG é um jogo de Horror Investigativo. Possui mecânicas simples e fluidas que permitem o foco na interpretação e investigação dos casos. Os personagens são investigadores que acabarão encontrando forças ocultas, maldições e cultos secretos nos anos 20. O livro terá terá regras para criação de personagem, regras de segurança na mesa, regras e dicas para o narrador organizar uma investigação, dicas para o narrador produzir seus próprios Props (material físico para a investigação), ambientação da cidade de Porto Alegre nos anos 20, dicas para converter e pesquisar sobre sua cidade nos anos 20, três Mistérios (Aventuras) prontos para serem narrados (com lista de props e arquivo digital para impressão e confecção) e um capítulo ensinando o narrador a montar seu próprio Mistério. O sistema foi feito para substituir o sistema Call of Cthulhu , que apesar de popular, não possui uma estrutura ideal para jogos de investigação. Com este sistema você poderá até mesmo converter e jogar com cenários de CoC com nenhum esforço. O foco do sistema é a investigação e as rolagens de dado (d12; roll under) servem exclusivamente para adicionar mais informações (Rolagem de Sorte) ou resistir ao medo (Rolagem de Controle). Em Casos Ocultos RPG os investigadores irão reunir provas físicas e montar o quebra-cabeça sozinhos sem rolar dados para isso. Tomando sempre cuidado para não se afundar nos horrores e se perder no medo."])</script>
