name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories surface even when nothing is merged.
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    # A real Postgres for the integration tests: the capacity rules must hold under real concurrency.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mesaaberta
          POSTGRES_PASSWORD: mesaaberta
          POSTGRES_DB: mesaaberta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesaaberta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test:unit
      - name: Integration tests against Postgres
        run: |
          echo 'DATABASE_URL=postgres://mesaaberta:mesaaberta@localhost:5432/mesaaberta' > .dev.vars
          pnpm run db:migrate
          pnpm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The same Supabase as production (Postgres, Auth, Storage) in Docker, with a mail inbox: the
      # tests sign up, confirm by email and reset passwords for real. It also runs the migrations.
      - run: pnpm run e2e:up
      - run: pnpm run test:e2e
      - run: pnpm exec supabase stop
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Low-severity advisories in SvelteKit's own dependencies are upstream's to fix.
      - run: pnpm audit --audit-level high
