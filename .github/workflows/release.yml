name: Release images

# Publishes the self-host images to GitHub Container Registry for amd64 and arm64 (Oracle's free tier
# is arm64). Production on Cloudflare deploys from the private repo's pinned tag and does not use
# these images.
#
# Tags on ghcr.io/<owner>/<repo>-<image> (web, api, worker, migrate):
#   every build            sha-<7 chars> (immutable, pin a deployment to it)
#   a release              vX.Y.Z, X.Y.Z and latest (latest is only ever a release)
#   a release from main    also main (moves)
# Staging follows main or a sha; production pins a release tag or a sha.
#
# A release is made by `tag.yml` on every merge to main that changes app code: it picks the next
# semver version, creates the tag and the GitHub release, and calls this workflow with that tag
# (a tag made with GITHUB_TOKEN does not start other workflows, so the call is explicit). Pushing a
# vX.Y.Z tag by hand still publishes it here.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) that `tag.yml` just created
        required: true
        type: string
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One publish at a time per ref, so the moving main tag always ends on the newest run. A run queued
# behind another is replaced by a newer one; its sha tag is skipped, main still moves forward.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Tag for this run
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
      moving: ${{ steps.tag.outputs.moving }}
    steps:
      - id: tag
        env:
          CALLED_TAG: ${{ inputs.tag }}
        run: |
          # Images are built once per commit under the sha tag; the release tags are joined to it.
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ -n "$CALLED_TAG" ]; then
            echo "release=$CALLED_TAG" >> "$GITHUB_OUTPUT"
            echo "moving=main" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "release=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  # One job per architecture builds the four images in turn: migrate is a stage of the web
  # Dockerfile, and the api and worker images start from the same dependency layer, so the layers
  # are reused on the runner instead of rebuilt.
  build:
    name: Build ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the ${{ matrix.arch }} images
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -e
          repo="${GITHUB_REPOSITORY,,}"
          build() { # image dockerfile [target]
            ref="$REGISTRY/$repo-$1:$TAG-${{ matrix.arch }}"
            docker build -f "$2" ${3:+--target "$3"} -t "$ref" .
            docker push "$ref"
          }
          build web apps/web/Dockerfile
          # The migration runner is a stage of the web Dockerfile.
          build migrate apps/web/Dockerfile migrate
          build api apps/api/Dockerfile
          build worker apps/worker/Dockerfile

  manifest:
    name: Publish ${{ matrix.image }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [web, api, worker, migrate]
    steps:
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures
        env:
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE: ${{ needs.version.outputs.release }}
          MOVING: ${{ needs.version.outputs.moving }}
        run: |
          set -e
          base="$REGISTRY/${GITHUB_REPOSITORY,,}-${{ matrix.image }}"
          tags="-t $base:$TAG"
          # v0.24.0 -> v0.24.0, 0.24.0 and latest
          if [ -n "$RELEASE" ]; then tags="$tags -t $base:$RELEASE -t $base:${RELEASE#v} -t $base:latest"; fi
          if [ -n "$MOVING" ]; then tags="$tags -t $base:$MOVING"; fi
          docker buildx imagetools create $tags "$base:$TAG-amd64" "$base:$TAG-arm64"
