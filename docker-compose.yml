# Local Postgres for development. Supabase runs Postgres too, so this matches production closely.
services:
  db:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: mesaaberta
      POSTGRES_PASSWORD: mesaaberta
      POSTGRES_DB: mesaaberta
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mesaaberta']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
