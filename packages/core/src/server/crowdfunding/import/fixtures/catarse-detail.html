<script>self.__next_f.push([1, "1:{\"campaign\": {\"id\": \"574103e3-546d-11f1-b1f4-de2b8262d5d0\", \"slug\": \"hdcrpg2e\", \"title\": \"Heran\\u00e7a de Cthulhu RPG\", \"summary\": \"Sobreviva em um mundo despeda\\u00e7ado pelo despertar dos grandes antigos! RPG p\\u00f3s-apocal\\u00edptico.\", \"thumbnail\": \"https://catarse-backend-prod.nyc3.digitaloceanspaces.com/catarse-backend-prod/project_photo/ca6e8fa164c8284cdd848.png\", \"status\": \"Launch\", \"fundingType\": \"All or Nothing\", \"startDate\": \"2026-09-15T15:00:47.634Z\", \"endDate\": \"2026-11-14T14:55:12.459Z\", \"category\": {\"id\": 2, \"name\": \"Jogos\", \"slug\": \"jogos\"}, \"user\": {\"publicName\": \"101 Games Brasil\"}, \"story\": \"$31\"}}\n31:T2508,Sobreviva em um mundo despeda\u00e7ado pelo despertar dos Grandes Antigos! Um RPG p\u00f3s-apocal\u00edptico. A Heran\u00e7a de Cthulhu \u2014 2\u00aa Edi\u00e7\u00e3o \u00e9 a nova vers\u00e3o do primeiro sucesso da 101 Games! Um jogo de interpreta\u00e7\u00e3o de personagens ambientado em um cen\u00e1rio onde a humanidade j\u00e1 perdeu seu lugar de destaque no cosmos e come\u00e7a, lentamente, a desaparecer por completo. Aqui n\u00e3o existem her\u00f3is, n\u00e3o h\u00e1 promessas de gl\u00f3ria, salva\u00e7\u00e3o ou finais verdadeiramente felizes. Em vez disso, voc\u00ea encontrar\u00e1 os Sobreviventes, pessoas comuns for\u00e7adas a encarar verdades que jamais deveriam ter sido reveladas. Aqui voc\u00ea interpretar\u00e1 um Sobrevivente \u2014 ou um pequeno grupo deles \u2014 que se v\u00ea envolvido em eventos maiores do que sua compreens\u00e3o. As amea\u00e7as n\u00e3o se resumem a criaturas monstruosas, mas incluem cultos, insanidade, paranoia, escassez e a lenta eros\u00e3o da sanidade. As hist\u00f3rias se desenvolvem em campanhas, que podem durar de algumas sess\u00f5es a longos per\u00edodos de jogo, acompanhando a decad\u00eancia, a transforma\u00e7\u00e3o ou o desaparecimento dos personagens. Poucos chegam ao fim ilesos: alguns enlouquecem e se tornam parte daquilo que antes temiam. Existem tr\u00eas formas de jogar A Heran\u00e7a de Cthulhu: Jogador Solo: na primeira forma de jogar, um jogador cria um ou mais Sobreviventes e interage com eles no mundo destru\u00eddo pelos Grandes Antigos. Assim, \u00e9 poss\u00edvel jogar A Heran\u00e7a de Cthulhu sozinho, interagindo com o cen\u00e1rio por meio de rolagens de dados nas tabelas predefinidas e desenvolvendo, aos poucos, sua hist\u00f3ria. Grupo de Jogadores: na segunda forma de jogar, voc\u00ea e um ou mais amigos utilizar\u00e3o as ferramentas de gera\u00e7\u00e3o e condu\u00e7\u00e3o do jogo sem a necessidade de um Mediador. Os eventos e personagens aparecer\u00e3o conforme rolagens aleat\u00f3rias em tabelas predefinidas, enquanto voc\u00eas reagir\u00e3o ao que surgir da maneira que considerarem mais coerente com seus personagens e, quando necess\u00e1rio, rolar\u00e3o dados para verificar se suas a\u00e7\u00f5es foram bem-sucedidas. Voc\u00eas poder\u00e3o andar juntos ou separados pelos setores da cidade, cada um realizando os passos descritos no cap\u00edtulo Jogando e resolvendo os resultados. Caso decidam andar juntos, o mesmo evento acontecer\u00e1 com o grupo inteiro, aumentando as chances de sucesso e, em alguns casos, tornando poss\u00edvel superar desafios mais complexos. Mediador: por fim, a terceira forma de jogar conta com um dos participantes no papel de Mediador, fun\u00e7\u00e3o semelhante \u00e0 de Mestre ou Narrador. O Mediador responder\u00e1 \u00e0s perguntas no lugar do Or\u00e1culo, solicitar\u00e1 os testes para a realiza\u00e7\u00e3o das a\u00e7\u00f5es b\u00e1sicas, rolar\u00e1 os eventos e mediar\u00e1 as a\u00e7\u00f5es dos jogadores, com liberdade para inserir elementos diferentes na hist\u00f3ria. O papel do Mediador ser\u00e1 explicado em detalhes no cap\u00edtulo Jogando . Os dois primeiros m\u00e9todos s\u00e3o diferentes do RPG tradicional, pois n\u00e3o dependem de um Mestre ou Narrador para contar a hist\u00f3ria. Todos os jogadores s\u00e3o livres para explorar o cen\u00e1rio, interpretando seus personagens conforme a hist\u00f3ria se desenvolve. Para jogar A Heran\u00e7a de Cthulhu, ser\u00e3o necess\u00e1rios este livro, l\u00e1pis, borracha, algumas folhas para anota\u00e7\u00f5es, uma ficha para cada personagem, voc\u00ea encontrar\u00e1 um modelo ao final do livro \u2014 e dois dados de dez faces, tamb\u00e9m conhecidos como d10, preferencialmente de cores diferentes. Esses dados podem ser encontrados em livrarias que vendam RPGs, lojas especializadas em jogos ou na internet. Tamb\u00e9m \u00e9 recomendada a constru\u00e7\u00e3o de um mapa com os setores do cen\u00e1rio. Assim, fica mais f\u00e1cil registrar as viagens, as moradas e os locais onde os eventos acontecem. Outra excelente proposta \u00e9 manter um di\u00e1rio de seu Sobrevivente, registrando os acontecimentos de cada dia. Com o tempo, esse relato pode se transformar em uma \u00f3tima estrutura para o desenvolvimento de hist\u00f3rias e at\u00e9 mesmo livros sobre as experi\u00eancias dos personagens. *Imagens ilustrativas - Podendo mudar no decorrer do projeto. A Heran\u00e7a de Cthulhu \u2014 2\u00aa Edi\u00e7\u00e3o ser\u00e1 apresentado em formato A5, com capa dura, aproximadamente 120 p\u00e1ginas em papel offset e conte\u00fado totalmente colorido. Esse n\u00famero poder\u00e1 aumentar caso metas extras sejam alcan\u00e7adas durante o financiamento coletivo. O conte\u00fado ser\u00e1 dividido da seguinte maneira: Um pequeno conto introdut\u00f3rio relatando a situa\u00e7\u00e3o dos Sobreviventes; Introdu\u00e7\u00e3o com informa\u00e7\u00f5es sobre o produto e tudo o que \u00e9 necess\u00e1rio para jogar; Descri\u00e7\u00e3o do cen\u00e1rio utilizado no jogo; Regras para cria\u00e7\u00e3o de personagens, com o passo a passo para montar seu Sobrevivente; Sistema de regras enxuto e funcional chamado Solo 10, o mesmo utilizado em Aventuras na Era Hiboriana e Her\u00f3is e Hordas, que utiliza dados de dez faces para a resolu\u00e7\u00e3o das a\u00e7\u00f5es; Regras para magias e artefatos sinistros trazidos ao mundo pelos Grandes Antigos; Regras para cria\u00e7\u00e3o, manuten\u00e7\u00e3o, melhoria e defesa do Ref\u00fagio onde os Sobreviventes buscam resistir ao fim do mundo, al\u00e9m de regras para cria\u00e7\u00e3o e melhoria de equipamentos; Regras para cria\u00e7\u00e3o de cen\u00e1rios e minicen\u00e1rios, cidades e locais em escombros onde os Sobreviventes se aventuram, tendo como exemplos as cidades de Arkham, Dunwich, Innsmouth e Kingsport; Sistema de jogo solo, com tabelas de eventos capazes de gerar dezenas de milhares de combina\u00e7\u00f5es diferentes, incluindo acontecimentos \u00fanicos, encontros neutros e violentos e personagens importantes; Sistema de evolu\u00e7\u00e3o de personagens, com regras simples para tornar seu Sobrevivente mais preparado para enfrentar os advers\u00e1rios; Sistema de Or\u00e1culo para dar ainda mais cor ao jogo, inserindo elementos com base em perguntas simples e rolagens de dados; Lista de advers\u00e1rios que poder\u00e3o ser enfrentados nas perigosas andan\u00e7as pela cidade; Fichas para registrar as estat\u00edsticas do Sobrevivente e de seu Ref\u00fagio. O sistema de testes de A Heran\u00e7a de Cthulhu se baseia na rolagem de um dado de dez faces, 1d10, somada ao valor do Atributo, da Per\u00edcia testada e de poss\u00edveis modificadores concedidos pelas Qualidades. Se a soma do dado, do Atributo e dos demais modificadores for maior ou igual a 10, ou ao valor do Perigo, em dificuldades superiores \u00e0 m\u00e9dia, como enfrentar o pr\u00f3prio Cthulhu, o teste ser\u00e1 bem-sucedido. Resultados superiores concedem b\u00f4nus no efeito das rolagens, chamados de B\u00f4nus de Poder, que permitem efeitos adicionais, como causar mais dano ou obter outras vantagens. Os personagens do cen\u00e1rio n\u00e3o rolam dados. Eles reagem \u00e0s a\u00e7\u00f5es do personagem de forma r\u00e1pida e din\u00e2mica, dando fluidez ao jogo. Existem ainda regras para armas, armaduras, diferentes tipos de dano, ferimentos e cura, al\u00e9m de mec\u00e2nicas exclusivas para a magia dos Grandes Antigos e para a loucura causada por eles. A condu\u00e7\u00e3o do jogo \u00e9 simples: seu personagem poder\u00e1 vagar pelo cen\u00e1rio, realizando aquilo que quiser \u2014 e conseguir. Sempre que necess\u00e1rio, poder\u00e1 retornar ao Ref\u00fagio para se proteger, curar ferimentos ou construir equipamentos, armas e melhorias. Os cen\u00e1rios s\u00e3o divididos em hex\u00e1gonos, representando as diferentes \u00e1reas de uma cidade completamente destru\u00edda. Deslocar-se para um setor adjacente leva uma hora a p\u00e9 ou meia hora utilizando um ve\u00edculo, como carro, moto ou \u00f4nibus. Assim que entrar em um novo setor, siga estes passos: Escolha uma a\u00e7\u00e3o; Role um evento na tabela espec\u00edfica do setor; Caso queira, realize outras a\u00e7\u00f5es, pagando o custo de tempo de cada uma delas. Entre as a\u00e7\u00f5es dispon\u00edveis, voc\u00ea poder\u00e1 procurar recursos, buscar abrigos tempor\u00e1rios ou novos Ref\u00fagios, conseguir armas e equipamentos e interagir com diferentes personagens do cen\u00e1rio. A Caixa de Segredos especial acompanha: 1 Livro Base de A Heran\u00e7a de Cthulhu \u2014 2\u00aa Edi\u00e7\u00e3o; 1 bloco com 50 fichas em tamanho A5, impressas frente e verso; 3 punchboards de marcadores; 3 p\u00f4steres A3, representando tr\u00eas cidades; 2 dados d10; 1 Escudo especial do Mediador. As metas extras alcan\u00e7adas e compat\u00edveis com a recompensa tamb\u00e9m ser\u00e3o inclu\u00eddas na caixa. Para tornar poss\u00edvel a materializa\u00e7\u00e3o deste projeto, o financiamento coletivo ter\u00e1 in\u00edcio em 15 de setembro de 2026, ao meio-dia (hor\u00e1rio de Bras\u00edlia), com o objetivo de arrecadar R$ 20.000 para a produ\u00e7\u00e3o dos exemplares e a prepara\u00e7\u00e3o das recompensas. A campanha ficar\u00e1 dispon\u00edvel por 60 dias. Caso seja bem-sucedida, o in\u00edcio dos envios aos apoiadores est\u00e1 planejado para aproximadamente oito meses ap\u00f3s seu encerramento. Esperamos contar com seu apoio para permitir o retorno do Grande Cthulhu! I\u00e4! I\u00e4! Cthulhu fhtagn! Ph\u2019nglui mglw\u2019nafh Cthulhu R\u2019lyeh wgah\u2019nagl fhtagn! *Imagens ilustrativas - Podendo mudar no decorrer do projeto. *Imagens ilustrativas - Podendo mudar no decorrer do projeto. *Imagens ilustrativas - Podendo mudar no decorrer do projeto. *Imagens ilustrativas - Podendo mudar no decorrer do projeto. *Imagens ilustrativas - Podendo mudar no decorrer do projeto. As recompensas para lojistas ser\u00e3o limitadas, mas n\u00e3o exclusivas. Haver\u00e1 uma quantidade definida de apoios dispon\u00edvel durante a campanha, sem exclusividade de territ\u00f3rio, distribui\u00e7\u00e3o ou venda para qualquer lojista espec\u00edfico. A campanha come\u00e7a em 15 de setembro de 2026, ao meio-dia (hor\u00e1rio de Bras\u00edlia). Ap\u00f3s o encerramento da campanha, os apoiadores receber\u00e3o orienta\u00e7\u00f5es para confirmar a grafia do nome que dever\u00e1 constar na publica\u00e7\u00e3o. As informa\u00e7\u00f5es precisar\u00e3o ser enviadas dentro do prazo de fechamento editorial divulgado pela 101 Games."])</script>
